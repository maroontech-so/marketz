<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Companies — KC-MIP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .mono { font-family: 'IBM Plex Mono', monospace; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body class="bg-[#F5F5F7] text-[#111315]">

  <header class="bg-[#0B0B0C] text-white sticky top-0 z-50 border-b border-white/10">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2">
        <span class="w-8 h-8 rounded-lg bg-[#FF4D1C] flex items-center justify-center font-bold text-sm">K</span>
        <div>
          <span class="font-extrabold text-lg tracking-tight">KC-MIP</span>
          <span class="block text-[9px] mono uppercase tracking-widest text-zinc-400">Kenya Markets</span>
        </div>
      </a>
      <nav class="flex items-center gap-1 text-sm font-medium">
        <a href="/" class="px-3 py-1.5 rounded-lg text-zinc-300 hover:text-white hover:bg-white/5">All News</a>
        <a href="/markets.html" class="px-3 py-1.5 rounded-lg text-zinc-300 hover:text-white hover:bg-white/5">Markets</a>
        <a href="/companies.html" class="px-3 py-1.5 rounded-lg bg-white/15 text-white font-semibold">Companies</a>
        <a href="/institutions.html" class="px-3 py-1.5 rounded-lg text-zinc-300 hover:text-white hover:bg-white/5">Institutions</a>
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 space-y-6">
    <div>
      <h1 class="text-2xl font-extrabold tracking-tight">Company Intelligence</h1>
      <p class="text-sm text-gray-500 mt-1">Click a ticker to load live news from aggregated Kenyan feeds.</p>
    </div>

    <div id="tickers" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3"></div>

    <section id="company-panel" class="hidden bg-white rounded-xl border border-gray-200 p-5">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 id="company-name" class="font-extrabold text-xl"></h2>
          <p id="company-meta" class="text-xs text-gray-500 mono mt-0.5"></p>
        </div>
        <button id="close-panel" class="text-xs font-semibold text-gray-400 hover:text-gray-700">Close ✕</button>
      </div>
      <div id="company-news" class="space-y-3"></div>
    </section>
  </main>

  <script>
    const COMPANIES = [
      { ticker: 'SCOM', name: 'Safaricom PLC', sector: 'Telecommunications' },
      { ticker: 'KCB', name: 'KCB Group PLC', sector: 'Banking' },
      { ticker: 'EQTY', name: 'Equity Group Holdings', sector: 'Banking' },
      { ticker: 'COOP', name: 'Co-operative Bank', sector: 'Banking' },
      { ticker: 'EABL', name: 'East African Breweries', sector: 'Manufacturing' },
      { ticker: 'KEGN', name: 'KenGen PLC', sector: 'Energy' },
      { ticker: 'CTUM', name: 'Centum Investment', sector: 'Investment' },
      { ticker: 'KPLC', name: 'Kenya Power', sector: 'Energy' },
      { ticker: 'NCBA', name: 'NCBA Group', sector: 'Banking' },
      { ticker: 'ABSA', name: 'Absa Bank Kenya', sector: 'Banking' },
      { ticker: 'SCBK', name: 'Standard Chartered', sector: 'Banking' },
      { ticker: 'KQ', name: 'Kenya Airways', sector: 'Aviation' },
    ];

    const $ = (id) => document.getElementById(id);

    $('tickers').innerHTML = COMPANIES.map(
      (c) => `
        <button onclick="loadCompany('${c.ticker}')" class="text-left bg-white rounded-xl border border-gray-200 p-4 hover:border-[#FF4D1C] hover:shadow-sm transition-all">
          <span class="inline-block px-2 py-0.5 rounded bg-[#0B0B0C] text-white text-[10px] mono font-bold">${c.ticker}</span>
          <div class="font-bold text-sm mt-2">${c.name}</div>
          <div class="text-xs text-gray-500 mt-0.5">${c.sector}</div>
        </button>
      `
    ).join('');

    async function loadCompany(ticker) {
      $('company-panel').classList.remove('hidden');
      $('company-name').textContent = ticker;
      $('company-meta').textContent = 'Loading live articles...';
      $('company-news').innerHTML = '<p class="text-sm text-gray-400">Fetching...</p>';

      try {
        const res = await fetch(`/api/companies/${ticker}`);
        const data = await res.json();
        $('company-name').textContent = data.name;
        $('company-meta').textContent = `NSE:${data.ticker} · ${data.articleCount} articles found in current feeds`;

        if (!data.articles.length) {
          $('company-news').innerHTML = '<p class="text-sm text-gray-400">No articles mentioning this ticker in the current RSS window. Feeds rotate frequently — try another ticker or check back later.</p>';
          return;
        }

        $('company-news').innerHTML = data.articles
          .map(
            (a) => `
              <a href="${a.originalUrl}" target="_blank" rel="noopener noreferrer" class="flex gap-4 p-3 rounded-xl border border-gray-100 hover:border-[#FF4D1C] hover:shadow-sm transition-all group">
                ${a.imageUrl ? `
                  <div class="w-20 sm:w-24 aspect-[4/3] rounded-lg overflow-hidden bg-gray-100 border border-gray-200 shrink-0">
                    <img src="${a.imageUrl}" alt="" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=1200&q=80';" />
                  </div>
                ` : ''}
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2 text-xs text-gray-500 mb-1">
                    <span class="font-semibold text-[#FF4D1C]">${a.sourceName}</span>
                    <span>·</span>
                    <span>${new Date(a.publishedAt).toLocaleDateString('en-KE', { day: 'numeric', month: 'short', year: 'numeric' })}</span>
                  </div>
                  <div class="font-semibold text-sm line-clamp-2 group-hover:text-[#FF4D1C] transition-colors">${a.title}</div>
                </div>
              </a>
            `
          )
          .join('');
      } catch (e) {
        $('company-meta').textContent = 'Failed to load company news.';
      }
    }

    $('close-panel').addEventListener('click', () => $('company-panel').classList.add('hidden'));
  </script>
</body>
</html>
