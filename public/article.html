<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KC-MIP — Article</title>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            display: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['IBM Plex Mono', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    .tabular { font-variant-numeric: tabular-nums; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(120, 125, 135, 0.35); border-radius: 999px; }
    .article-body { color: #1f2937; }
    .dark .article-body { color: #d1d5db; }
    .article-body h2 { font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:1.5rem; line-height:1.3; margin:2rem 0 .75rem; color:#111315; }
    .dark .article-body h2 { color:#f9fafb; }
    .article-body h3 { font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:1.2rem; margin:1.5rem 0 .5rem; color:#111315; }
    .dark .article-body h3 { color:#f3f4f6; }
    .article-body p { margin:0 0 1.15rem; font-size:1.05rem; line-height:1.75; }
    .article-body a { color:#FF4D1C; text-decoration:underline; text-underline-offset:2px; }
    .article-body ul, .article-body ol { margin:0 0 1.25rem 1.5rem; }
    .article-body li { margin-bottom:.4rem; line-height:1.7; }
    .article-body blockquote { border-left:4px solid #FF4D1C; padding-left:1rem; margin:1.5rem 0; font-style:italic; color:#4b5563; }
    .dark .article-body blockquote { color:#9ca3af; }
    .article-body figure { margin:1.75rem 0; }
    .article-body figcaption { font-size:.75rem; color:#6b7280; margin-top:.5rem; }
    .article-body img { border-radius:.75rem; width:100%; height:auto; display:block; }
    .article-body table { width:100%; border-collapse:collapse; margin:1.5rem 0; font-size:.9rem; }
    .article-body th, .article-body td { border:1px solid #e5e7eb; padding:.6rem .75rem; }
    .dark .article-body th, .dark .article-body td { border-color:#27272a; }
  </style>
</head>
<body class="bg-white text-[#111315] dark:bg-[#0C0D10] dark:text-[#F3F4F6] font-sans antialiased selection:bg-[#FF4D1C] selection:text-white overflow-x-hidden">

  <header class="sticky top-0 z-40 bg-[#0B0B0C] text-white border-b border-white/10">
    <div class="max-w-[1320px] mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-2.5 shrink-0 text-left">
        <span class="w-8 h-8 rounded-lg bg-[#FF4D1C] flex items-center justify-center">
          <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 17l6-6 4 4 8-8M14 7h7v7M20 8A8 8 0 0 0 5.1 6.1M4 16a8 8 0 0 0 14.9 1.9"/>
          </svg>
        </span>
        <div>
          <span class="font-display font-extrabold text-lg tracking-tight text-white block leading-none">KC-MIP</span>
          <span class="text-[9px] font-mono uppercase tracking-[0.16em] text-zinc-400 block mt-0.5">Kenya Markets</span>
        </div>
      </a>
      <div class="flex items-center gap-2 shrink-0">
        <button onclick="location.href='index.html'" class="p-2 rounded-lg text-zinc-300 hover:text-white hover:bg-white/10 transition-colors" title="Back to feed">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <button onclick="toggleTheme()" class="p-2 rounded-lg text-zinc-300 hover:text-white hover:bg-white/10 transition-colors" title="Toggle theme">
          <svg class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
          <svg class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12 space-y-10"></main>

  <footer class="border-t border-[#E5E7EB] dark:border-zinc-800 bg-[#F5F5F7] dark:bg-[#111318] mt-14">
    <div class="max-w-[1320px] mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-zinc-500 dark:text-zinc-400">
      <div class="font-display font-bold text-sm text-[#111315] dark:text-white">KC-MIP · Kenya Capital Markets Intelligence Platform</div>
      <div class="font-mono text-[11px]">RIGHTS-AWARE · DPA 2019</div>
    </div>
  </footer>

  <script>
    const CATEGORY_LABELS = {
      all: 'All',
      equity_markets: 'Equities',
      corporate_developments: 'Corporate',
      fixed_income: 'Fixed Income',
      regulation_policy: 'Regulation',
      private_markets: 'Private Markets',
    };

    function formatEAT(iso) {
      try {
        return new Date(iso).toLocaleString('en-GB', {
          timeZone: 'Africa/Nairobi',
          day: '2-digit', month: 'short', year: 'numeric',
          hour: '2-digit', minute: '2-digit', hour12: false
        }) + ' EAT';
      } catch (e) { return iso; }
    }

    function timeAgo(iso) {
      const diff = Date.now() - new Date(iso).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      return `${Math.floor(hrs / 24)}d ago`;
    }

    async function fetchJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      return res.json();
    }

    function escHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function toggleTheme() { document.documentElement.classList.toggle('dark'); }

    (async function render() {
      const root = document.getElementById('app');
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if (!id) {
        root.innerHTML = `<div class="py-20 text-center rounded-2xl border border-[#E5E7EB] dark:border-zinc-800 bg-[#F5F5F7] dark:bg-zinc-900/50"><h3 class="font-display font-bold text-lg">Article not specified.</h3><p class="text-sm text-zinc-500 dark:text-zinc-400 mt-1">Open an article from the feed.</p><a href="index.html" class="px-4 py-2 rounded-lg bg-[#FF4D1C] text-white text-xs font-bold mt-3 inline-block">Back to feed</a></div>`;
        return;
      }

      root.innerHTML = `<div class="py-20 text-center"><div class="skeleton h-8 w-1/3 mx-auto rounded mb-3"></div><div class="skeleton h-4 w-full mx-auto rounded"></div></div>`;
      const style = document.createElement('style');
      style.textContent = `.skeleton{background:linear-gradient(90deg,rgba(0,0,0,0.04)0%,rgba(0,0,0,0.08)50%,rgba(0,0,0,0.04)100%);background-size:400px 100%;animation:shimmer 1.4s ease-in-out infinite}@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}.dark .skeleton{background:linear-gradient(90deg,rgba(255,255,255,0.03)0%,rgba(255,255,255,0.06)50%,rgba(255,255,255,0.03)100%);background-size:400px 100%}`;
      document.head.appendChild(style);

      try {
        const data = await fetchJSON('/api/article/' + encodeURIComponent(id));
        const a = data.article;
        if (!a) throw new Error('not found');

        const categoryLabel = CATEGORY_LABELS[a.category] || 'Markets';
        const hasImage = Boolean(a.imageUrl);
        const hasFullText = Boolean(a.contentHtml && a.contentHtml.trim().length > 200);
        const isOfficial = a.rights === 'official_disclosure' || a.rights === 'licensed_full_text';
        const isSummary = a.rights === 'summary_permitted';
        const hasRewrite = Boolean(a.rewrittenHtml && a.rewrittenHtml.trim().length > 200);

        let bodyHtml = '';
        let attributionNote = '';

        if (isOfficial && hasFullText) {
          bodyHtml = `<div class="article-body prose prose-lg dark:prose-invert max-w-none">${a.contentHtml}</div>`;
          attributionNote = `<div class="mt-8 p-4 rounded-xl border border-emerald-200 dark:border-emerald-800/50 bg-emerald-50/60 dark:bg-emerald-950/20 text-xs"><div class="font-bold text-emerald-800 dark:text-emerald-300">Full text reproduced under licence</div><p class="mt-1 text-emerald-900/80 dark:text-emerald-200/80">This article is reproduced in full from ${escHtml(a.sourceName)} under KC-MIP's reproduction rights.</p></div>`;
        } else if (isSummary && hasRewrite) {
          bodyHtml = `<div class="mb-4 flex items-center gap-2 text-[11px] font-semibold uppercase tracking-wider text-amber-700 dark:text-amber-400"><span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>${a.rewriteMethod === 'extractive' ? 'Extractive summary' : 'AI-rewritten summary'}</div><div class="article-body prose prose-lg dark:prose-invert max-w-none">${a.rewrittenHtml}</div>`;
          attributionNote = `<div class="mt-8 p-4 rounded-xl border border-amber-200 dark:border-amber-800/50 bg-amber-50/60 dark:bg-amber-950/20 text-xs"><div class="font-bold text-amber-800 dark:text-amber-300">Summary, not a full reproduction</div><p class="mt-1 text-amber-900/80 dark:text-amber-200/80">${a.sourceName} permits summary reproduction only. For the complete article, read it at ${a.sourceName}.</p><a href="${escHtml(a.sourceUrl)}" target="_blank" rel="noopener noreferrer" class="inline-block mt-3 px-4 py-2 rounded-lg bg-[#FF4D1C] text-white text-xs font-bold">Read the full article at ${escHtml(a.sourceName)} &nearr;</a></div>`;
        } else {
          bodyHtml = `<div class="article-body prose prose-lg dark:prose-invert max-w-none"><p class="text-lg leading-relaxed">${a.summary || 'No summary was provided in the source feed.'}</p></div>`;
          attributionNote = `<div class="mt-8 p-4 rounded-xl border border-amber-200 dark:border-amber-800/50 bg-amber-50/60 dark:bg-amber-950/20 text-xs"><div class="font-bold text-amber-800 dark:text-amber-300">Excerpt only</div><p class="mt-1 text-amber-900/80 dark:text-amber-200/80">${a.fullTextStatus === 'paywalled' ? a.sourceName + ' places this article behind a paywall.' : a.fullTextStatus === 'blocked' ? a.sourceName + ' blocks automated retrieval.' : 'Full text has not been retrieved yet.'} Only the verified excerpt is shown here.</p><a href="${escHtml(a.sourceUrl)}" target="_blank" rel="noopener noreferrer" class="inline-block mt-3 px-4 py-2 rounded-lg bg-[#FF4D1C] text-white text-xs font-bold">Read at ${escHtml(a.sourceName)} &nearr;</a></div>`;
        }

        // Related coverage: same tickers or institutions
        const news = await fetchJSON('/api/news?limit=200').catch(() => ({ articles: [] }));
        const tick = new Set(a.tickers || []);
        const inst = new Set(a.institutions || []);
        const related = (news.articles || [])
          .filter(x => x.id !== a.id)
          .map(x => {
            let score = 0;
            (x.tickers || []).forEach(t => { if (tick.has(t)) score += 2; });
            (x.institutions || []).forEach(i => { if (inst.has(i)) score += 1; });
            if (x.category === a.category) score += 1;
            return { x, score };
          })
          .filter(x => x.score > 0)
          .sort((x, y) => y.score - x.score)
          .slice(0, 4)
          .map(x => x.x);

        const imageTag = hasImage
          ? `<figure class="mt-8 rounded-2xl overflow-hidden border border-[#E5E7EB] dark:border-zinc-800 bg-[#F5F5F7] dark:bg-zinc-900"><div class="aspect-video w-full overflow-hidden"><img src="${escHtml(a.imageUrl)}" alt="${escHtml(a.title)}" class="w-full h-full object-cover" onerror="this.parentElement.parentElement.style.display='none';" /></div></figure>`
          : `<div class="mt-8 border-t border-[#E5E7EB] dark:border-zinc-800"></div>`;

        root.innerHTML = `
          <div class="flex items-center justify-between gap-3 mb-8">
            <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-zinc-500 hover:text-[#FF4D1C]"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>Back to feed</a>
            <div class="flex items-center gap-2">
              <a href="${escHtml(a.sourceUrl)}" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 rounded-lg bg-[#FF4D1C] text-white text-xs font-bold">Open original &nearr;</a>
            </div>
          </div>

          <article>
            <header class="space-y-4 ${hasImage ? '' : 'pb-6 border-b border-[#E5E7EB] dark:border-zinc-800'}">
              <div class="flex items-center gap-2 text-xs font-medium flex-wrap">
                <span class="font-semibold text-[#FF4D1C]">${escHtml(categoryLabel)}</span>
                <span class="text-zinc-300 dark:text-zinc-600">·</span>
                <span class="text-[#5F6368] dark:text-zinc-400">${timeAgo(a.publishedAt)}</span>
                <span class="text-zinc-300 dark:text-zinc-600">·</span>
                <span class="text-[11px] text-zinc-400 dark:text-zinc-500">${escHtml(a.sourceName)}</span>
                ${a.readingTimeMinutes ? `<span class="text-zinc-300 dark:text-zinc-600">·</span><span class="text-[11px] text-zinc-400 dark:text-zinc-500">${a.readingTimeMinutes} min read</span>` : ''}
              </div>
              <h1 class="font-display font-extrabold text-3xl sm:text-4xl lg:text-[44px] leading-[1.1] tracking-[-0.03em] text-[#111315] dark:text-white">${escHtml(a.title)}</h1>
              ${a.byline ? `<div class="text-sm text-zinc-500 dark:text-zinc-400">By ${escHtml(a.byline)}</div>` : ''}
              <div class="flex flex-wrap items-center gap-x-5 gap-y-1.5 font-mono text-[11px] text-zinc-500">
                <span>Published: <strong class="text-[#111315] dark:text-zinc-200">${formatEAT(a.publishedAt)}</strong></span>
                ${a.wordCount ? `<span>${a.wordCount.toLocaleString()} words in source</span>` : ''}
              </div>
            </header>

            ${imageTag}

            <div class="mt-8">
              ${bodyHtml}
              ${attributionNote}
            </div>
          </article>

          ${related.length ? `
          <section class="mt-12 space-y-4">
            <h2 class="font-display font-bold text-xl tracking-tight">Related Coverage (${related.length})</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              ${related.map(rel => `
                <a href="article.html?id=${escHtml(rel.id)}" class="p-4 rounded-xl border border-[#E5E7EB] dark:border-zinc-800 hover:border-[#FF4D1C] flex gap-3 bg-white dark:bg-[#12141A] block">
                  ${rel.imageUrl ? `<div class="w-20 aspect-[4/3] rounded-lg overflow-hidden bg-[#F5F5F7] dark:bg-zinc-900 border border-[#E5E7EB] dark:border-zinc-800 shrink-0"><img src="${escHtml(rel.imageUrl)}" alt="" loading="lazy" class="w-full h-full object-cover" onerror="this.parentElement.style.display='none';" /></div>` : ''}
                  <div class="flex-1 min-w-0">
                    <div class="text-[10px] text-zinc-400 dark:text-zinc-500">${escHtml(rel.sourceName)} · ${timeAgo(rel.publishedAt)}</div>
                    <div class="text-xs font-semibold mt-0.5 line-clamp-2">${escHtml(rel.title)}</div>
                  </div>
                </a>
              `).join('')}
            </div>
          </section>
          ` : ''}
        `;
      } catch (e) {
        root.innerHTML = `<div class="py-20 text-center rounded-2xl border border-[#E5E7EB] dark:border-zinc-800 bg-[#F5F5F7] dark:bg-zinc-900/50"><h3 class="font-display font-bold text-lg">Could not load article.</h3><p class="text-sm text-zinc-500 dark:text-zinc-400 mt-1">${escHtml(e.message || 'Unknown error')}</p><a href="index.html" class="px-4 py-2 rounded-lg bg-[#FF4D1C] text-white text-xs font-bold mt-3 inline-block">Back to feed</a></div>`;
      }
    })();
  </script>
</body>
</html>
